name: Build and Release Layer8 GUI

on:
  push:
    tags:
      - 'v*.*.*'   # e.g. v1.4.2 - pushing a version tag builds and publishes a release
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        env:
          L8_VERSION: ${{ github.ref_name }}
        run: python build.py

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Layer8 GUI ${{ github.ref_name }}
          body: |
            ## Layer8 Security Platform ${{ github.ref_name }}

            ### Install
            1. Download **layer8-gui-windows.zip** below.
            2. Extract it anywhere.
            3. Run **Layer8-GUI.exe** - no install, no setup.
            4. Sign in with the email and access key issued from the Layer8 web console.

            The app checks for updates automatically on startup.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed.
          files: release/layer8-gui-windows.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Upload build artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: layer8-gui-windows
          path: release/layer8-gui-windows.zip
